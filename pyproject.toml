[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agentic-rag"
version = "0.1.0"
description = "Enterprise Agentic RAG with PGVector Semantic Retrieval and Deterministic Guardrails"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sugumaran Balasubramaniyan", email = "sugumaran.balasubramaniyan@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "tiktoken>=0.6.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "streamlit>=1.32.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
